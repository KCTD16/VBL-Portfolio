<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | VBL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0a0a0c; --text-color: #ffffff; --accent: #FA7301; }
        [data-theme='light'] { --bg-color: #ffffff; --text-color: #0a0a0c; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Inter', sans-serif; transition: background-color 0.4s ease; }
        .font-brand-editorial { font-family: 'Playfair Display', serif; font-weight: 900; font-style: italic; letter-spacing: -0.06em; line-height: 0.9; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-8 md:p-12">
    <!-- Navbar -->
    <nav class="flex justify-between items-center w-full">
        <a href="/" class="font-brand-editorial text-3xl md:text-4xl uppercase hover:opacity-60 transition">VBL</a>
        <a href="/" class="text-[10px] uppercase font-bold tracking-[0.4em] opacity-60 hover:opacity-100 transition">Return Home &rarr;</a>
    </nav>

    <!-- 404 Message -->
    <main class="text-center py-20">
        <p class="text-[11px] uppercase tracking-[0.5em] text-[var(--accent)] font-bold mb-4">Error 404</p>
        <h1 class="text-7xl md:text-[10rem] font-brand-editorial mb-8">Lost in motion.</h1>
        <p class="text-sm md:text-base opacity-60 max-w-md mx-auto mb-10 leading-relaxed">
            The page you are looking for has been moved or doesn't exist.
        </p>
        <a href="/" class="inline-block border border-current px-8 py-3 text-[10px] uppercase font-bold tracking-[0.3em] hover:bg-white hover:text-black transition">
            Back to Home
        </a>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-[10px] uppercase tracking-[0.3em] opacity-40">
        &copy; Visuals by Laurine
    </footer>

    <script>
        // Inherit user's saved theme preference
        const savedTheme = localStorage.getItem('vbl-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
