<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Works — {{ bio.name }}</title>
    <meta name="description" content="Complete archive of motion and still visual works by {{ bio.name }}.">

    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0a0a0c;
            --text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #FA7301;
        }
        [data-theme='light'] {
            --bg-color: #ffffff;
            --text-color: #0a0a0c;
            --border-color: rgba(0, 0, 0, 0.08);
            --accent: #FA7301;
        }

        html { scroll-behavior: smooth; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Inter', sans-serif; 
            transition: background-color 0.4s ease, color 0.4s ease; 
            overflow-x: hidden; 
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); }

        .font-brand-editorial { 
            font-family: 'Playfair Display', serif; 
            font-weight: 900; 
            font-style: italic; 
            letter-spacing: -0.06em; 
            line-height: 0.9; 
        }

        /* Subtle scroll reveals */
        .reveal { opacity: 0; transform: translateY(20px); transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }

        /* Custom cursor (desktop only) */
        @media (pointer: fine) { 
            body, a, button, .project-card { cursor: none !important; } 
        }
        #custom-cursor {
            position: fixed; top: 0; left: 0; width: 32px; height: 32px; background: white; pointer-events: none; z-index: 9999; 
            mix-blend-mode: difference;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            will-change: transform; transition: opacity 0.2s ease; opacity: 0;
        }

        /* Filter tab styling */
        .filter-btn { 
            opacity: 0.35; 
            transition: opacity 0.3s ease, border-color 0.3s ease; 
            font-size: 11px; 
            letter-spacing: 0.35em; 
            font-weight: 700; 
            text-transform: uppercase; 
            padding-bottom: 6px;
            border-bottom: 2px solid transparent; 
        }
        .filter-btn.active { 
            opacity: 1; 
            border-bottom: 2px solid currentColor; 
        }
    </style>
</head>
<body>
    <div id="custom-cursor"></div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 z-[1000] bg-black/95 hidden items-center justify-center p-4 md:p-8" onclick="closeLightbox()">
        <!-- Close button -->
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-white/60 hover:text-white text-2xl transition z-10 p-2" aria-label="Close modal">
            <i class="fas fa-times"></i>
        </button>

        <!-- Inner wrapper: stopPropagation prevents accidental close on click -->
        <div class="relative max-w-5xl w-full flex flex-col items-center justify-center" onclick="event.stopPropagation()">
            <div id="lightbox-content" class="w-full flex items-center justify-center"></div>
            <div id="lightbox-meta" class="text-[11px] uppercase tracking-[0.4em] text-white/50 pt-6 text-center"></div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="p-8 md:p-12 flex justify-between items-center w-full mix-blend-difference text-white">
        <a href="/" class="font-brand-editorial text-3xl md:text-4xl hover:opacity-60 transition uppercase">VBL</a>
        
        <div class="flex gap-8 text-[10px] uppercase font-bold tracking-[0.4em]">
            <a href="/" class="opacity-40 hover:opacity-100 transition">Home</a>
            <span class="border-b border-current">Full works</span>
        </div>
    </nav>

    <!-- Header & Filter Tabs -->
    <header class="px-6 md:px-12 py-16 md:py-24 border-b border-[var(--border-color)] reveal">
        <h1 class="text-6xl md:text-9xl font-brand-editorial">Full works.</h1>
        <div class="mt-12 flex gap-8">
            <button onclick="filterWorks('all', this)" class="filter-btn active">All</button>
            <button onclick="filterWorks('video', this)" class="filter-btn">Motion</button>
            <button onclick="filterWorks('image', this)" class="filter-btn">Stills</button>
        </div>
    </header>

    <!-- Masonry Works Section -->
    <main class="px-4 md:px-8 py-12 pb-24">
        <div id="masonry" class="columns-1 sm:columns-2 lg:columns-3 gap-6 space-y-6">
            {% for project in projects %}
            <div class="project-card reveal relative group break-inside-avoid overflow-hidden bg-zinc-900 border border-[var(--border-color)] {% if project.is_video %}type-video{% else %}type-image{% endif %}" 
                 data-meta="{{ project.meta }}" 
                 onclick="handleArchiveClick(this, '{{ project.is_video }}', '{{ project.video if project.is_video else project.image }}')">
                
                {% if project.is_video %}
                    <video loop muted playsinline preload="metadata" class="archive-vid w-full h-auto object-cover grayscale group-hover:grayscale-0 transition duration-500" onerror="this.closest('.project-card').style.display='none'">
                        <source src="{{ project.video }}" type="video/mp4">
                    </video>
                    <div class="absolute top-4 right-4 text-white/40 group-hover:text-white transition">
                        <i class="fas fa-play text-[8px]"></i>
                    </div>
                {% else %}
                    <img src="{{ project.image }}" loading="lazy" alt="{{ project.title }}" onerror="this.closest('.project-card').style.display='none'" class="w-full h-auto object-cover grayscale group-hover:grayscale-0 transition-transform duration-700 group-hover:scale-105">
                {% endif %}

                <!-- Hover metadata overlay -->
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-6 pointer-events-none">
                    <p class="text-[11px] uppercase tracking-widest font-bold text-white">{{ project.title }}</p>
                    <p class="text-[9px] uppercase tracking-widest text-white/60 mt-1">{{ project.meta }}</p>
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- Empty state (hidden by default) -->
        <div id="filter-empty" class="hidden py-24 text-center">
            <p class="text-xs uppercase tracking-[0.4em] opacity-40">No projects found in this view.</p>
        </div>
    </main>

    <!-- Clickable Footer with proper Mailto -->
    <footer class="py-32 text-center border-t border-[var(--border-color)]">
        <a href="mailto:{{ bio.contact.email }}" class="text-2xl md:text-4xl font-brand-editorial uppercase hover:text-[var(--accent)] transition">
            {{ bio.contact.email }}
        </a>
    </footer>

    <!-- Persistent Theme Toggle (Matches Home page) -->
    <button onclick="toggleTheme()" class="fixed bottom-8 right-8 w-12 h-12 rounded-full bg-[var(--text-color)] text-[var(--bg-color)] flex items-center justify-center shadow-2xl z-[100] hover:scale-110 transition" aria-label="Toggle Theme">
        <i id="theme-icon" class="fas fa-sun text-sm"></i>
    </button>

    <script>
        // 1. Theme Persistence (Synchronized with localStorage)
        const savedTheme = localStorage.getItem('vbl-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('vbl-theme', next);
            updateThemeIcon(next);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('theme-icon');
            if (icon) {
                icon.className = theme === 'dark' ? 'fas fa-sun text-sm' : 'fas fa-moon text-sm';
            }
        }

        // 2. Scroll Observers
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active'); });
        }, { threshold: 0.05 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        // 3. Custom Cursor (Proper variable scoping)
        const cursor = document.getElementById('custom-cursor');
        let isHovering = false;

        document.addEventListener('mousemove', (e) => {
            cursor.style.opacity = '1';
            window.requestAnimationFrame(() => {
                cursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0) translate(-50%, -50%) scale(${isHovering ? 1.5 : 1})`;
            });
        });

        // 4. Video Hover Previews (Strictly Silent)
        document.querySelectorAll('.archive-vid').forEach(vid => {
            const card = vid.closest('.project-card');
            card.addEventListener('mouseenter', () => {
                vid.muted = true; // Always silent on hover
                vid.play().catch(() => {});
                isHovering = true;
            });
            card.addEventListener('mouseleave', () => {
                vid.pause();
                isHovering = false;
            });
        });

        // 5. Lightbox Logic with Escape Key
        function handleArchiveClick(el, isV, src) {
            const vid = el.querySelector('video');
            if (vid) vid.pause();
            openLightbox(isV, src, el.getAttribute('data-meta'));
        }

        function openLightbox(isV, src, meta) {
            const lb = document.getElementById('lightbox');
            lb.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Prevent background scrolling

            document.getElementById('lightbox-content').innerHTML = isV === 'True'
                ? `<video controls autoplay class="max-w-full max-h-[75vh] shadow-2xl rounded"><source src="${src}" type="video/mp4"></video>`
                : `<img src="${src}" class="max-w-full max-h-[75vh] object-contain shadow-2xl rounded">`;

            document.getElementById('lightbox-meta').innerText = meta || "";
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.style.display = 'none';
            document.getElementById('lightbox-content').innerHTML = '';
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        // 6. Clean Filtering Logic without breaking Masonry
        function filterWorks(type, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            let visibleCount = 0;
            document.querySelectorAll('.project-card').forEach(card => {
                const matches = (type === 'all') ||
                                (type === 'video' && card.classList.contains('type-video')) ||
                                (type === 'image' && card.classList.contains('type-image'));

                if (matches) {
                    card.classList.remove('hidden');
                    visibleCount++;
                } else {
                    card.classList.add('hidden');
                }
            });

            const emptyNotice = document.getElementById('filter-empty');
            if (emptyNotice) {
                emptyNotice.classList.toggle('hidden', visibleCount > 0);
            }
        }

        // Hover feedback for links
        document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('mouseenter', () => isHovering = true);
            el.addEventListener('mouseleave', () => isHovering = false);
        });
    </script>
</body>
</html>
